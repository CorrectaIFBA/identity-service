spring.datasource.url=jdbc:h2:mem:identitydb;NON_KEYWORDS=VALUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

spring.rabbitmq.addresses=amqp://guest:guest@localhost:5672
identities.jwt.secret=test-only-secret-0123456789-0123456789
identities.first-account.setup-enabled=false
spring.sql.init.mode=never
identities.internal.token=test-internal-token
