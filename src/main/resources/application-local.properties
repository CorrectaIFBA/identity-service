# Local development overrides. Activate with SPRING_PROFILES_ACTIVE=local.

spring.datasource.url=${ENV_DATASOURCE_POSTGRES_URL:jdbc:postgresql://localhost:30201/identitydb}
spring.datasource.username=${ENV_DATASOURCE_POSTGRES_USERNAME:appuser}
spring.datasource.password=${ENV_DATASOURCE_POSTGRES_PASSWORD:apppassword}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.rabbitmq.addresses=${ENV_RABBITMQ_URL:amqp://guest:guest@localhost:5672}

identities.jwt.secret=${ENV_IDENTITIES_JWT_SECRET:local-dev-only-secret-change-me-0123456789}
identities.internal.token=${ENV_IDENTITIES_INTERNAL_TOKEN:local-internal-token}

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
