spring.application.name=identity-service

# === PostgreSQL ===
spring.datasource.url=${ENV_DATASOURCE_POSTGRES_URL}
spring.datasource.username=${ENV_DATASOURCE_POSTGRES_USERNAME}
spring.datasource.password=${ENV_DATASOURCE_POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# === JPA ===
spring.jpa.hibernate.ddl-auto=${ENV_JPA_DDL_AUTO:update}
spring.jpa.show-sql=false

# === Schema fixes applied before Hibernate (idempotent, PostgreSQL only) ===
spring.sql.init.mode=${ENV_SQL_INIT_MODE:always}
spring.sql.init.schema-locations=classpath:db/postgresql/schema.sql
spring.sql.init.separator=^^^

# === RabbitMQ ===
spring.rabbitmq.addresses=${ENV_RABBITMQ_URL}
mailer.rabbitmq.exchange=${ENV_MAILER_RABBITMQ_EXCHANGE:send-transactional-mail-exchange}
mailer.rabbitmq.routing-key=${ENV_MAILER_RABBITMQ_ROUTING_KEY:send-transactional-mail-routing-key}

# === ProxyCheck.io (Feign base URL; client path already includes /v3) ===
clients.proxy-check.url=${ENV_PROXY_CHECK_URL:https://proxycheck.io}

# === Identities ===
identities.jwt.secret=${ENV_IDENTITIES_JWT_SECRET}
identities.jwt.access-token-duration=${ENV_IDENTITIES_JWT_ACCESS_TOKEN_DURATION:900}
identities.jwt.refresh-token-duration=${ENV_IDENTITIES_JWT_REFRESH_TOKEN_DURATION:604800}
identities.internal.token=${ENV_IDENTITIES_INTERNAL_TOKEN:}
identities.account-activation.base-url=${ENV_IDENTITIES_ACCOUNT_ACTIVATION_BASE_URL:http://localhost:5173/activate-account}
identities.first-account.setup-enabled=${ENV_IDENTITIES_FIRST_ACCOUNT_SETUP_ENABLED:true}
identities.first-account.email=${ENV_IDENTITIES_FIRST_ACCOUNT_EMAIL:20241160014@ifba.edu.br}
identities.first-account.person-name=${ENV_IDENTITIES_FIRST_ACCOUNT_PERSON_NAME:Administrador}
identities.first-account.person-document-number=${ENV_IDENTITIES_FIRST_ACCOUNT_PERSON_DOCUMENT_NUMBER:000.000.000-00}

# === SpringDoc OpenAPI ===
springdoc.api-docs.enabled=${ENV_SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${ENV_SPRINGDOC_ENABLED:false}

# === Actuator ===
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
